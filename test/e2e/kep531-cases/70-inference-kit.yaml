# Case 7 — inference-kit (driver scenario 3): broadcast, fragments + patches,
# wrap-activation via /command/0 head-inserts.
#
# The runtime ships as a pure-Python wheel in a carrier image with no shell
# of its own: an image volume exposes the carrier's /wheel to an
# initContainer, which pip-installs it into a shared emptyDir. The
# containerPatches then carry the component-independent activation surface —
# mounts, PYTHONPATH, a securityContext capability — plus the launcher
# wrap: the engine command [python, -c, …] head-inserts become
# [python, -m, inference_kit.cli, python, -c, …], so the runtime interpreter
# exec's the launcher with the original argv untouched. Head-inserts stack
# with the later rule landing leftmost, hence the reverse-order listing.
# The launcher passes unrecognized commands through byte-identically, so a
# plain sleep keeps the wrapped engine alive for startup-level assertion.
# The role references the profile once per component (D1), each reference
# consenting patchContainers: [engine]; its only own data is IK_ALL=0
# (feature level 0 = pass-through) and the empty capabilities list the
# SYS_RESOURCE patch appends to.
#
# Expected render (RoleInstanceSet, one group of size 2):
#   both pods gain the inference-kit and inference-kit-wheel volumes, the
#   install initContainer, the /opt/inference-kit mount, PYTHONPATH, the
#   wrapped command, and SYS_RESOURCE in the engine's capabilities; the
#   rendered template is identical in both components (one
#   component-scoped reference per component, same consent).
# Expected startup: initContainer Completed; the engine process runs with
#   the launcher on sys.path and the wrapped argv, and stays alive.
apiVersion: workloads.x-k8s.io/v1alpha2
kind: ClusterEngineRuntimeProfile
metadata:
  name: kep531-inference-kit
spec:
  updateStrategy: RollingUpdate
  volumes:
    - name: inference-kit
      emptyDir: {}
    - name: inference-kit-wheel
      image:
        reference: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/inference-kit:sha-5dd19905cfd3acf211b9ce127ac4531b1bfd78a0
        pullPolicy: IfNotPresent
  initContainers:
    - name: inference-kit-install
      image: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/python:3.11-slim
      command:
        [
          "pip",
          "install",
          "--no-deps",
          "-t",
          "/opt/inference-kit",
          "/carrier/wheel/inference_kit-0.1.0-py3-none-any.whl",
        ]
      volumeMounts:
        - name: inference-kit
          mountPath: /opt/inference-kit
        - name: inference-kit-wheel
          mountPath: /carrier
          readOnly: true
  containerPatches:
    - jsonPatch:
        op: add
        path: /volumeMounts/-
        value:
          name: inference-kit
          mountPath: /opt/inference-kit
          readOnly: true
    - jsonPatch:
        op: add
        path: /env/-
        value:
          name: PYTHONPATH
          value: /opt/inference-kit
    - jsonPatch:
        op: add
        path: /securityContext/capabilities/add/-
        value: SYS_RESOURCE
    - jsonPatch:
        op: add
        path: /command/0
        value: inference_kit.cli
    - jsonPatch:
        op: add
        path: /command/0
        value: -m
    - jsonPatch:
        op: add
        path: /command/0
        value: python
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: ik
  namespace: kep531
spec:
  roles:
    - name: worker
      replicas: 1
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              - name: engine
                image: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/sglang:v0.5.21
                command: ["python"]
                args: ["-c", "import time; time.sleep(3600)"]
                env:
                  - name: IK_ALL
                    value: "0"
                securityContext:
                  capabilities:
                    add: []
      engineRuntimes:
        - profileName: kep531-inference-kit
          component: leader
          patchContainers: [engine]
        - profileName: kep531-inference-kit
          component: worker
          patchContainers: [engine]
