# Case 2 — unaimed patch (consent model).
#
# Profile declares containerPatches but the reference lists no
# patchContainers: fragments (sidecar, volume) still inject; the patches
# do NOT fire; a UnaimedContainerPatch warning event is recorded on the
# RBG. The reference stays in the compatibility shape (profileName only,
# no component, no patch fields), which is a valid state — a profile
# gaining containerPatches cannot break a pre-existing reference.
# D2 note: the absent-component default is pattern-dependent — this role
# is standalonePattern, so it expands to the single implicit component and
# the fragments deliver; under leaderWorkerPattern the same reference
# would deliver to the leader only (main's published worker-side sidecar
# skip).
#
# Expected: PYTHONPATH stays /usr/lib/python, no IK_SITE var, ik-sidecar present,
# event reason UnaimedContainerPatch on RoleBasedGroup unaimed.
apiVersion: workloads.x-k8s.io/v1alpha2
kind: ClusterEngineRuntimeProfile
metadata:
  name: kep531-unaimed
spec:
  updateStrategy: NoUpdate
  containers:
    - name: ik-sidecar
      image: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/busybox:1.36
      command: ["sleep", "3600"]
  volumes:
    - name: ik-unaimed-vol
      emptyDir: {}
  containerPatches:
    - jsonPatch:
        op: add
        path: /env/-
        value:
          name: IK_SITE
          value: /opt/ik/site
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: unaimed
  namespace: kep531
spec:
  roles:
    - name: worker
      replicas: 1
      annotations:
        rbg.workloads.x-k8s.io/role-workload-type: apps/v1/Deployment
      standalonePattern:
        template:
          spec:
            containers:
              - name: engine
                image: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/python:3.11-slim
                command: ["python"]
                args: ["-c", "import time; time.sleep(3600)"]
                env:
                  - name: PYTHONPATH
                    value: /usr/lib/python
      engineRuntimes:
        - profileName: kep531-unaimed
