# Case 5 — split delivery (component-scoped references).
#
# One leaderWorkerPattern role references the same profile twice, once per
# component (D1 — one reference names at most one component):
#   component: leader, no patch fields
#                                -> pod-level fragments (the emptyDir
#                                   volume) render into the leader
#                                   component only; the reference grants
#                                   no patch consent, so the profile's
#                                   patches do not fire there
#   component: worker, patchContainers: [engine]
#                                -> the fragments render into the worker
#                                   component and the container patch
#                                   fires at the worker's engine container
# Each reference bundles its fragment delivery and its patch consent
# inside its own component scope; the same profileName may appear twice
# because the two references own disjoint components (D6).
#
# Expected render (RoleInstanceSet split-worker, one group of size 2):
#   leader pod: ik-split-vol present in spec.volumes; engine container
#               has no IK_SITE — the leader reference does not consent
#   worker pod: engine container gains IK_SITE=/opt/ik/site; spec.volumes
#               also carries ik-split-vol — fragment delivery follows
#               the reference's component scope, so the worker reference
#               delivers the fragments along with its consent
# Neither engine container mounts ik-split-vol (the profile declares no
# volumeMounts patch), so both pods run. The leader reference lists no
# patchContainers while the profile declares containerPatches, so one
# UnaimedContainerPatch warning event is recorded on the RBG.
#
# Pending a disposable-cluster run: none of these cases has yet been
# applied against a cluster running the reworked engine runtime API.
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: ClusterEngineRuntimeProfile
metadata:
  name: kep531-split
spec:
  updateStrategy: NoUpdate
  volumes:
    - name: ik-split-vol
      emptyDir: {}
  containerPatches:
    - jsonPatch:
        op: add
        path: /env/-
        value:
          name: IK_SITE
          value: /opt/ik/site
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: split
  namespace: kep531
spec:
  roles:
    - name: worker
      replicas: 1
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              - name: engine
                image: kube-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-dev/python:3.11-slim
                command: ["python"]
                args: ["-c", "import time; time.sleep(3600)"]
      engineRuntimes:
        - profileName: kep531-split
          component: leader
        - profileName: kep531-split
          component: worker
          patchContainers: [engine]
