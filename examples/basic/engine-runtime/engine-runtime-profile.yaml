# Example: ClusterEngineRuntimeProfile with RoleBasedGroup (v1alpha2)
# ClusterEngineRuntimeProfile defines a cluster-scoped reusable sidecar/init-container profile
# that can be injected into role pods via the engineRuntimes field.
# Useful for injecting GPU drivers, monitoring sidecars, or shared runtime dependencies.
---
# Step 1: Create a ClusterEngineRuntimeProfile (cluster-scoped resource)
apiVersion: workloads.x-k8s.io/v1alpha2
kind: ClusterEngineRuntimeProfile
metadata:
  name: nvidia-runtime-profile
spec:
  # updateStrategy: NoUpdate (default) or RollingUpdate
  # NoUpdate: profile changes do not trigger pod updates
  # RollingUpdate: profile changes trigger rolling update of associated pods
  updateStrategy: RollingUpdate
  initContainers:
    - name: gpu-driver-init
      image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
      command: ["/bin/sh", "-c", "echo 'GPU driver initialized'"]
      volumeMounts:
        - name: gpu-lib
          mountPath: /usr/local/lib/gpu
  containers:
    - name: gpu-monitor
      image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
      ports:
        - containerPort: 9090
          name: metrics
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
  volumes:
    - name: gpu-lib
      emptyDir: {}
  # containerPatches: RFC 6902 `add` ops applied to the containers listed
  # in the referencing engineRuntimes[] entry's patchContainers, within
  # that entry's named component. Ops apply in list order; `/X/0`
  # head-inserts, so a multi-element command prepend is written in reverse
  # (the rendered command below is ["/opt/gpu/wrap", "exec", "nginx"]).
  containerPatches:
    - jsonPatch:
        op: add
        path: /command/0
        value: "exec"
    - jsonPatch:
        op: add
        path: /command/0
        value: "/opt/gpu/wrap"
    - jsonPatch:
        op: add
        path: /env/-
        value:
          name: GPU_WRAPPER_SITE
          value: /opt/gpu/site
    - jsonPatch:
        op: add
        path: /volumeMounts/-
        value:
          name: gpu-lib
          mountPath: /usr/local/lib/gpu
    - jsonPatch:
        op: add
        path: /securityContext/capabilities/add/-
        value: SYS_RESOURCE

---
# Step 2: Create a RoleBasedGroup referencing the engine runtime profile
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: gpu-inference
  namespace: default
spec:
  roles:
    - name: prefill
      replicas: 2
      # engineRuntimes: reference the profile. component scopes the
      # reference to one component of the role's pattern; patchContainers
      # consents to the profile's containerPatches at the named role
      # containers. Without consent the fragments still inject, but the
      # patches do not fire (an UnaimedContainerPatch warning event is
      # emitted).
      engineRuntimes:
        - profileName: nvidia-runtime-profile
          component: worker
          patchContainers:
            - prefill-main
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              # A patch may only prepend to a declared command — creating one
              # would silently discard the image ENTRYPOINT — so declare it.
              - name: prefill-main
                image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
                command: ["nginx"]
                ports:
                  - containerPort: 8080
                resources:
                  requests:
                    nvidia.com/gpu: "1"
                  limits:
                    nvidia.com/gpu: "1"

    - name: decode
      replicas: 4
      engineRuntimes:
        - profileName: nvidia-runtime-profile
          component: worker
          patchContainers:
            - decode-main
      leaderWorkerPattern:
        size: 2
        template:
          spec:
            containers:
              - name: decode-main
                image: anolis-registry.cn-zhangjiakou.cr.aliyuncs.com/openanolis/nginx:1.14.1-8.6
                command: ["nginx"]
                ports:
                  - containerPort: 8081
                resources:
                  requests:
                    nvidia.com/gpu: "1"
                  limits:
                    nvidia.com/gpu: "1"
